# Publishes the package and its docs to Hex when a GitHub release is published.
# The release tag must be "v" followed by the version in mix.exs, for example v0.4.0.
name: Publish to Hex

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    env:
      OTP_VERSION: '27'
      ELIXIR_VERSION: '1.17.3'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Check the release tag matches mix.exs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -nE 's/^ *@version "([^"]+)".*/\1/p' mix.exs)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG doesn't match the mix.exs version $version (expected v$version)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Run tests
        env:
          MIX_ENV: test
        run: mix test

      - name: Publish package and docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
